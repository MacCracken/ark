name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of truth
          # for the toolchain version — no version is hardcoded here, and the
          # separate `.cyrius-toolchain` file was REMOVED at 6.6.2 because it was
          # a second source of truth that had drifted: it said 6.3.38 while the
          # manifest pinned 6.6.2, so CI installed one toolchain and the pin
          # redirect then demanded another.
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Lint
        run: |
          for f in src/types.cyr src/output.cyr src/transaction.cyr src/db.cyr src/engine.cyr src/recipe.cyr src/cli.cyr; do
            cyrius lint "$f"
          done

      - name: Build
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build -D ARK_MAIN src/main.cyr build/ark

      - name: Test
        run: cyrius test tests/ark.tcyr

      - name: Bench
        run: cyrius bench tests/ark.bcyr

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          for doc in README.md CHANGELOG.md VERSION LICENSE cyrius.cyml; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done
